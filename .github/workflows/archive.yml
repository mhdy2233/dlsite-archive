name: archive

on:
  schedule:
    - cron: '0 */4 * * *'        # every 4 hours (UTC)
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many new works to archive this run'
        default: '50'
      start_page:
        description: 'Start from listing page N (use >1 to backfill older works)'
        default: '1'
      categories:
        description: 'Comma separated: game,audio'
        default: 'game'
      skip_vpn:
        description: 'Skip VPN setup (debug only)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install openvpn
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn curl

      - name: Check runner capabilities
        run: |
          echo "tun: $(ls -l /dev/net/tun 2>&1 || echo MISSING)"
          echo "netns: $(sudo ip netns list 2>&1 | head -1)"
          echo "kernel: $(uname -r)"

      - name: Archive new works
        run: |
          set -o pipefail
          LIMIT="${{ github.event.inputs.limit || '50' }}"
          START="${{ github.event.inputs.start_page || '1' }}"
          CATS="${{ github.event.inputs.categories || 'game' }}"
          FLAGS=""
          if [ "${{ github.event.inputs.skip_vpn }}" = "true" ]; then FLAGS="--no-vpn"; fi
          rc=0
          for cat in $(echo "$CATS" | tr ',' ' '); do
            echo "===== $cat ====="
            python3 scripts/run.py --category "$cat" --limit "$LIMIT" \
              --start-page "$START" $FLAGS 2>&1 | tee -a /tmp/archive.log || rc=1
          done
          exit $rc

      - name: Diagnose tunnel (on failure)
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "### tunnel diagnostics"
            echo '```'
            echo "-- ip netns --";      sudo ip netns list 2>&1 | head -5
            echo "-- ns links --";      sudo ip netns exec dlsitevpn ip -brief link 2>&1 | head -10
            echo "-- ns routes --";     sudo ip netns exec dlsitevpn ip route 2>&1 | head -10
            echo "-- ns egress --";     sudo ip netns exec dlsitevpn curl -4 -sS --max-time 10 https://ipinfo.io/json 2>&1 | head -5
            echo "-- host tun --";      ip -brief link show tun0 2>&1 | head -3
            echo "-- openvpn log --";   sudo tail -40 /var/lib/dlsite-vpn/openvpn.log 2>&1
            echo "-- iptables --";      sudo iptables -S 2>&1 | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Persist failure log (readable from CI)
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p .diag
          {
            echo "run: $GITHUB_RUN_ID  $(date -u)"
            echo; echo "===== archive.log =====";
            tail -120 /tmp/archive.log 2>&1
            echo; echo "===== netns =====";
            sudo ip netns list 2>&1
            echo; echo "===== tun0 (host) =====";
            ip -brief addr show tun0 2>&1
            echo; echo "===== openvpn =====";
            sudo tail -60 /tmp/dlsite-vpn/openvpn.log 2>&1
            echo; echo "===== iptables =====";
            sudo iptables -S 2>&1 | head -20
            echo; echo "===== capabilities =====";
            ls -l /dev/net/tun 2>&1
          } > .diag/last-failure.txt 2>&1 || true
          git config user.name  "dlsite-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .diag/last-failure.txt
          git commit -m "diag: tunnel failure [skip ci]" || true
          git push || true

      - name: Clear stale diagnostics
        if: success()
        run: rm -rf .diag

      - name: Build static site
        run: python3 scripts/build_site.py

      - name: Commit
        run: |
          git config user.name  "dlsite-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            STATS=$(python3 - <<'PY' 2>/dev/null || echo "0 0"
          import json
          try:
              st = json.load(open('data/state.json'))
          except Exception:
              st = {}
          if 'done' in st:
              st = {'game': st}
          cats = [v for v in st.values() if isinstance(v, dict)]
          print(sum(v.get('last_ok', 0) for v in cats), sum(len(v.get('done', [])) for v in cats))
          PY
            )
            OK=$(echo "$STATS" | cut -d' ' -f1)
            TOTAL=$(echo "$STATS" | cut -d' ' -f2)
            git commit -m "archive: +${OK} works (total ${TOTAL}) [skip ci]"
            git push
          fi

      - name: Summary
        run: |
          python3 - <<'PY'
          import json, os
          try:
              st = json.load(open('data/state.json'))
          except Exception:
              st = {}
          if 'done' in st:                 # legacy single-category shape
              st = {'game': st}
          cats = {k: v for k, v in st.items() if isinstance(v, dict)}
          total = sum(len(v.get('done', [])) for v in cats.values())
          ok = sum(v.get('last_ok', 0) for v in cats.values())
          fail = sum(v.get('last_fail', 0) for v in cats.values())
          print("### DLsite archive")
          for k, v in cats.items():
              print(f"- {k}: **{len(v.get('done', []))}** works")
          print(f"- total: **{total}** works")
          print(f"- last run: +{ok} ok / {fail} failed")
          size = 0
          for r, _, fs in os.walk('docs/api'):
              for f in fs:
                  try:
                      size += os.path.getsize(os.path.join(r, f))
                  except OSError:
                      pass
          print(f"- site payload: {size/1024/1024:.0f} MB")
          PY
